<div class="container">
  <form>
    <div class="col-md-4 mb-4">
      <label>Equipe Instant (en tapant)</label>
      <input type="text" class="form-control form-control-lg" name="searchTerm"
             [(ngModel)]="searchTerm" placeholder="Ex : Inter Miami">
    </div>
  </form>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>#</th>
            <th>CIN</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Poste</th>
            <th>Equipe Instant</th>
            <th>Date Mercato</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let j of joueurs | searchFilter: searchTerm; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ j.cin }}</td>
            <td>{{ j.nomJoueur }}</td>
            <td>{{ j.prenomJoueur }}</td>
            <td>{{ j.poste?.nomPoste }}</td>
            <td>{{ j.equipeInstant }}</td>
            <td>{{ j.dateMercato | date:'dd/MM/yyyy' }}</td>
          </tr>
        </tbody>
      </table>
      <p *ngIf="(joueurs | searchFilter: searchTerm).length === 0" class="text-danger">
        Aucun joueur trouvé.
      </p>
    </div>
  </div>
</div>
